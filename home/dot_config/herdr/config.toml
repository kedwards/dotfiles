onboarding = false
[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = false

[theme]
name = "terminal"
auto_switch = false


[worktrees]
directory = "~/projects"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"
