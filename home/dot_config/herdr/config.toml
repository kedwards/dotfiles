### https://github.com/andischerer/herdr-plugin-echo
[[keys.command]]
key = "prefix+alt+m"
type = "plugin_action"
command = "herdr-plugin-echo.mark"
description = "echo: toggle focused pane"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "herdr-plugin-echo.mark-all"
description = "echo: toggle all panes in tab"

[[keys.command]]
key = "prefix+shift+e"
type = "plugin_action"
command = "herdr-plugin-echo.broadcast"
description = "echo: toggle broadcast pane"

### https://github.com/ChmaraX/herdr-gitview
