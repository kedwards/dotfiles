onboarding = false

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = false

### herdr-automatic-rename
# herdr plugin action invoke herdr-automatic-rename.reset
prompt_new_tab_name = false

[theme]
name = "one-dark"
auto_switch = false

[worktrees]
directory = "~/projects"

### https://github.com/natori-hrj/herdr-lazy
# herdr plugin pane open --plugin herdr-lazy --entrypoint manage --focus
[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "herdr-lazy.manage"
description = "manage plugins"

### https://github.com/kedwards/herdr-awst
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "herdr-awst.login"
description = "awst login"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "herdr-awst.logout"
description = "awst logout"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "herdr-awst.connect"
description = "awst connect"

### https://github.com/CowboyVang/herdr-which-key
[[keys.command]]
key = "prefix+space"
type = "popup"
command = "sh ~/.config/herdr/plugins/config/cowboyvang.which-key/launch.sh"
description = "which-key: show prefix bindings"
width = "78%"
height = "62%"

### https://github.com/andrewchng/herdr-sessionizer
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "sessionizer.open"
description = "open project workspace"

[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "sessionizer.worktree-open"
description = "open worktree workspace"

[[keys.command]]
key = "prefix+down"
type = "plugin_action"
command = "sessionizer.close"
description = "close or remove workspaces"

### https://github.com/ChmaraX/herdr-nvim
[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

